<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pacifico', cursive;
      background-color: pink;
      text-align: center;
      padding: 20px;
    }
    .romantic {
      font-size: 24px;
      color: #d10068;
    }
    button {
      font-family: 'Pacifico', cursive;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      background-color: #ff66b2;
      color: white;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    input[type="checkbox"] {
      transform: scale(1.5);
      margin-right: 10px;
    }
    .sticker {
      width: 50px;
      margin: 5px;
    }
    label {
      display: inline-flex;
      align-items: center;
      margin: 10px;
      gap: 10px;
    }
    img.food, img.drink {
      width: 50px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <img src="https://i.imgur.com/JeXUFZh.png" class="sticker" alt="Heart">
  <img src="https://i.imgur.com/xmMiYrI.png" class="sticker" alt="Rose">

  <h1 class="romantic">Hey beautiful, do you want a present from me? 💝</h1>
  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 😢</button>

  <div id="nextPart" style="display:none; margin-top: 30px;">
    <p class="romantic">When's your birthday? 🎂</p>
    <input type="date" id="birthday"><br><br>

    <p class="romantic">What foods do you like? 🍕🍣🍰</p>

    <label>
      <input type="checkbox">
      <img src="https://pixabay.com/photos/pizza-slice-cheese-food-italian-3007395/
" alt="Pizza">
      <a href="#">Pizza</a>
    </label>
    <label>
      <input type="checkbox">
      <img src="https://unsplash.com/s/photos/sushi" class="food" alt="Sushi">
      <a href="#">Sushi</a>
    </label>
    <label>
      <input type="checkbox">
      <img src="https://unsplash.com/photos/a-person-is-grilling-meat-on-a-grill-hWxFxd-VySY" class="food" alt="Korean Food">
      <a href="#">Cake</a>
    </label><br><br>

    <p class="romantic">What drinks do you like? 🧃☕🥤</p>

    <label>
      <input type="checkbox">
      <img src="https://unsplash.com/photos/a-green-and-white-drink-sitting-on-top-of-a-table-gQ0lcnq8FAI" class="drink" alt="Matcha Latte">
      <a href="#">Juice</a>
    </label>
    <label>
      <input type="checkbox">
      <img src="https://unsplash.com/photos/white-ceramic-cup-with-saucer-on-brown-wooden-table-3n3mPoGko8g" class="drink" alt="Coffee">
      <a href="#">Coffee</a>
    </label>
    <label>
      <input type="checkbox">
      <img src="https://unsplash.com/photos/a-young-woman-is-holding-a-plastic-cup-of-brown-sugar-bubble-milk-tea-at-a-night-market-in-taiwan-taiwan-delicacy-close-up-pmp2gi-JnEU" class="drink" alt="Bobba">
      <a href="#">Milk Tea</a>
    </label><br><br>

    <p class="romantic">UwU now click to get the present 🎁</p>
    <button id="giftBtn">Click me 💝</button>

    <div id="giftArea" style="display:none; margin-top: 20px;">

      <!-- Put your image here -->
      <img src="[https://unsplash.com/photos/a-shadow-of-a-person-making-a-heart-with-their-hands-Vgt-NUy_kio]" alt="Your gift image" style="width: 200px;"><br><br>

      <h2 class="romantic">🎉 Congratulations, now you're in love with me 💘</h2>
    </div>
  </div>

  <script>
    let noBtn = document.getElementById("noBtn");
    let yesBtn = document.getElementById("yesBtn");
    let clickCount = 0;

    noBtn.addEventListener("click", function() {
      if (clickCount < 30) {
        clickCount++;
        let scale = 1 + clickCount * 0.1;
        yesBtn.style.transform = `scale(${scale})`;
      }
    });

    yesBtn.addEventListener("click", function() {
      document.getElementById("nextPart").style.display = "block";
    });

    document.getElementById("giftBtn").addEventListener("click", function() {
      document.getElementById("giftArea").style.display = "block";
    });
  </script>

</body>
</html>
